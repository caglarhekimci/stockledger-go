name: Docker validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: stockledger-check-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Exercise containerized workflow and persistence
        run: node scripts/docker-smoke.mjs
      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p docker-evidence
          docker compose ps -a > docker-evidence/containers.txt
          docker compose logs --no-color > docker-evidence/containers.log
          docker version > docker-evidence/docker-version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stockledger-docker-evidence
          path: docker-evidence
      - name: Remove this run's disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
